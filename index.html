<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Open Graph Meta Tags -->
    <meta
      property="og:title"
      content="Jana Semmer ° Full-Stack Software Engineer Portfolio"
    />
    <meta property="og:site_name" content="Web card" />
    <meta property="og:url" content="https://wixhub.github.io/" />
    <meta
      property="og:description"
      content="Jana Semmer - Full-Stack Software Engineer. Portfolio and project links."
    />
    <meta
      name="description"
      content="Jana Semmer's Full-Stack Software Engineer Portfolio. View modern web applications, health tools and CSS animations."
    />

    <title>Jana Semmer ° Full-Stack Software Engineer</title>

    <!-- Modern FontAwesome for Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Google Fonts for warm, modern typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Header Section -->
    <header class="hero">
      <div class="hero-content">
        <h1>Jana Semmer</h1>
        <h2>Full-Stack Software Engineer, M.Sc.</h2>
        <p>
          Bridging robust backend architecture with intuitive, high-performance
          frontend experiences to deliver high-impact digital products
        </p>
      </div>
    </header>

    <!-- Main Content for Projects -->
    <main class="container">
      <section class="container">
        <!-- Dynamic filter tags container -->
        <div id="filter-container" class="filter-container">
          <!-- Filter buttons will be generated here automatically by script.js -->
        </div>

        <h3 class="section-title">My Projects</h3>

        <div class="grid" id="projects-grid">
          <!-- Project cards will be loaded dynamically -->
        </div>
      </section>
    </main>

    <!-- Footer Section -->
    <footer class="footer">
      <div class="footer-icons">
        <a href="https://github.com/wixhub" target="_blank" aria-label="GitHub"
          ><i class="fab fa-github"></i
        ></a>
        <a
          href="https://www.researchgate.net/profile/Yana-Semenova-5"
          target="_blank"
          aria-label="ResearchGate"
          ><i class="fab fa-researchgate"></i
        ></a>
        <a href="mailto:jana.semenova@web.de" aria-label="Email"
          ><i class="fas fa-envelope"></i
        ></a>
        <a href="https://t.me/typeweb" target="_blank" aria-label="Telegram"
          ><i class="fab fa-telegram"></i
        ></a>
        <a
          href="https://discord.com/users/wixhub#0725"
          target="_blank"
          aria-label="Discord"
          ><i class="fab fa-discord"></i
        ></a>
      </div>
      <div class="footer-copy">
        <p>
          &copy; <span id="current-year"></span> @wixhub. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- Custom JS -->
    <script src="js/script.js"></script>
  </body>
</html>
